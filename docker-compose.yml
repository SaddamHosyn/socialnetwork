version: "3.8"

services:
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - "./backend/database:/app/database"
      - "./uploads:/app/uploads"
    environment:
      - PORT=8080
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/heartbeat", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: "./Next + React + Typescript"
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - social-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  social-network:
    driver: bridge
